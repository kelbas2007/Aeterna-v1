name: Development regressions

on:
  pull_request:
  push:
    branches: [main, research/beyond-intel4, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
      - uses: Swatinem/rust-cache@v2
      - name: Check every compilation target
        run: cargo check --locked --all-targets
      - name: Run ordinary and causal regressions
        shell: bash
        run: |
          set -o pipefail
          bash scripts/check.sh 2>&1 | tee regression.log
      - name: Persist and resume in separate processes
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/demo.sh 2>&1 | tee demos.log
      - name: Preserve regression output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: development-regression-log
          path: |
            regression.log
            demos.log
          if-no-files-found: ignore
