name: g23-composition
# G23 mechanism rerun after preregistered promotion-count repair; no fresh pack.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/g23-composition.yml']
permissions:
  contents: read
jobs:
  composition:
    if: >-
      github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'g23: run compositional perceptual mechanism'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify exact committed source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
      - name: G23 compositional perceptual causal witness
        run: |
          set -o pipefail
          cargo test --release --test g23_compositional_perceptual_function -- --nocapture | tee g23-evidence.log
      - name: G22 perceptual variable regression
        run: cargo test --release --test g22_perceptual_variable_invention -- --nocapture
      - name: G21 contextual refinement regression
        run: cargo test --release --test g21_contextual_state_refinement g21_ -- --nocapture
      - name: G20 integrated lifetime regression
        run: cargo test --release --test g20_continual_reasoning g20_ -- --nocapture
      - name: Human Protection regression
        run: cargo test --release --test human_protection -- --nocapture
      - name: Full ordinary regression suite
        run: cargo test --release --all --all-targets -- --nocapture
      - name: Release build
        run: cargo build --release
      - name: Preserve G23 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g23-evidence
          path: g23-evidence.log
          if-no-files-found: ignore
          retention-days: 30
      - name: Verify tracked source unchanged
        if: always()
        run: git diff --exit-code
