name: Adaptive history suffix developmental integrity
on:
  pull_request:
    paths:
      - 'src/construction/runtime.rs'
      - 'src/construction/unified_port.rs'
      - 'src/unified_runtime.rs'
      - 'tests/adaptive_history_suffix_development.rs'
      - '.github/workflows/adaptive-history-suffix-development.yml'
permissions:
  contents: read
concurrency:
  group: adaptive-suffix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin Rust and source
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.0 --profile minimal
          rustup override set 1.99.0
          mkdir -p suffix-evidence
          git rev-parse HEAD > suffix-evidence/source.txt
      - uses: Swatinem/rust-cache@v2
      - name: Test real-context controlled predictions and all fail-closed cases
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --test adaptive_history_suffix_development \
            -- --nocapture --test-threads=1 2>&1 | tee suffix-evidence/test.log
          python scripts/project_audit.py | tee suffix-evidence/source-audit.json
      - name: Preserve all positive and negative engineer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-suffix-${{ runner.os }}-${{ github.sha }}
          path: suffix-evidence/
          retention-days: 7
          if-no-files-found: warn
