name: Relational workspace - same image different history native controls
on:
  push:
    branches: ['research/beyond-intel4']
    paths:
      - 'src/phase_relational_workspace.rs'
      - 'src/phase_general_policy.rs'
      - 'src/phase_native.rs'
      - 'src/scientific_runtime.rs'
      - 'src/bin/external_world_agent.rs'
      - 'tests/relational_workspace_native.rs'
      - '.github/workflows/relational-workspace-native.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  physical:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.0'}
      - uses: Swatinem/rust-cache@v2
      - name: Build all targets without changing old policy behavior
        run: cargo check --locked --all-targets
      - name: Grounded history, occlusion, comparison and physical lesion
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --release --test relational_workspace_native -- --nocapture 2>&1 | tee relational-workspace-native.log
          cargo test --locked --release --test general_policy_native -- --nocapture
          cargo test --locked --release --test episode_sequence_replay -- --nocapture
      - name: Retain raw physical tests even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relation-native-first-evidence
          path: relational-workspace-native.log
          if-no-files-found: ignore
