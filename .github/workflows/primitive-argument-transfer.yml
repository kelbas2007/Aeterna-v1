name: Acquired operation argument transfer

on:
  push:
    branches: ['research/beyond-intel4']
    paths:
      - 'src/phase_primitives.rs'
      - 'src/phase_induction.rs'
      - 'src/phase_primitive_arguments.rs'
      - 'tests/primitive_argument_transfer.rs'
      - 'tests/acquired_primitives.rs'
      - '.github/workflows/primitive-argument-transfer.yml'
  pull_request:
    paths:
      - 'src/phase_primitives.rs'
      - 'src/phase_induction.rs'
      - 'src/phase_primitive_arguments.rs'
      - 'tests/primitive_argument_transfer.rs'
      - '.github/workflows/primitive-argument-transfer.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: primitive-argument-transfer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check committed source without applying patches
        run: |
          rustfmt --edition 2021 --check src/phase_primitives.rs src/phase_induction.rs src/phase_primitive_arguments.rs tests/primitive_argument_transfer.rs
          cargo check --locked --all-targets
          git diff --exit-code
      - name: Argument transfer and existing acquired-operation regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --release --test primitive_argument_transfer --test acquired_primitives --test real_programs -- --nocapture 2>&1 | tee primitive-transfer.log
          grep -F 'PRIMITIVE_ARGUMENT_MECHANISM correct=96/96 old_unbound=48/96' primitive-transfer.log
          grep -F 'PRIMITIVE_ARGUMENT_RUNTIME correct=48/48' primitive-transfer.log
      - name: Preserve positive or negative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: primitive-argument-transfer-evidence
          path: primitive-transfer.log
          if-no-files-found: ignore
