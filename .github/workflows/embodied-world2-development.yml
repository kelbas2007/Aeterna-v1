# Manual diagnostic: repeatable native controls are covered by scripts/check.sh.
# Preserve original runs and score verdicts; ordinary pushes do not rescore them.
name: Embodied-world 2 - 4 real outside worlds 256-step matched curriculum
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  independent-multiworld:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env: {CARGO_BUILD_JOBS: 2, SDL_VIDEODRIVER: dummy}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.0'}
      - uses: Swatinem/rust-cache@v2
      - name: Install independent Farama 3.1.0 worlds
        run: python -m pip install 'minigrid==3.1.0'
      - name: Compile and test unprivileged CPU-first organism
        run: |
          cargo check --locked --all-targets
          cargo test --locked --release --test self_object_effect_native
          cargo build --locked --release --bin external_world_agent
      - name: Matched no-navigation ablation across four external worlds
        shell: bash
        run: |
          set -o pipefail
          python scripts/external_unstaged_world1.py \
            --agent target/release/external_world_agent \
            --budget 256 --include-empty --seed-offset 6000 \
            --output embodied2-ablation.json 2>&1 | tee embodied2-ablation.log
      - name: New full multiworld autonomous embodied cognition
        shell: bash
        run: |
          set -o pipefail
          python scripts/external_unstaged_world1.py \
            --agent target/release/external_world_agent \
            --embodied --budget 256 --include-empty --seed-offset 6000 \
            --output embodied2-agent.json 2>&1 | tee embodied2-agent.log
      - name: Compare independently measured terminal task successes
        shell: bash
        run: |
          python - <<'PY'
          import json
          a=json.load(open('embodied2-ablation.json'))
          x=json.load(open('embodied2-agent.json'))
          assert x['train_seeds']==a['train_seeds']==list(range(56000,56012))
          assert x['heldout_seeds']==a['heldout_seeds']==list(range(57000,57004))
          assert x['budget']==a['budget']==256
          assert len(x['worlds'])==len(a['worlds'])==4
          assert x['embodied_navigation'] and not a['embodied_navigation']
          assert x['total_physical_actions']>0 and a['total_physical_actions']>0
          assert x['random_task_successes']==a['random_task_successes']
          multi=x['heldout_successes_by_world']
          passed=x['eval_task_successes']>=6 and x['eval_task_successes']>a['eval_task_successes'] and x['eval_task_successes']>x['random_task_successes'] and (multi['MiniGrid-DoorKey-5x5-v0']>0 or multi['MiniGrid-MultiRoom-N2-S4-v0']>0) and x['eval_key_pickups']>0 and x['eval_door_openings']>0
          print('EMBODIED2_REAL_TASKS '
                f"ablated={a['eval_task_successes']}/16 "
                f"embodied={x['eval_task_successes']}/16 "
                f"random={x['random_task_successes']}/16 "
                f"per_world={multi} "
                f"moves={x['eval_executed_moves']} "
                f"keys={x['eval_key_pickups']} "
                f"doors={x['eval_door_openings']} "
                f"verdict={'DEVELOPMENT_PASS' if passed else 'DEVELOPMENT_FAIL'}")
          PY
      - name: Always retain complete matched raw outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: embodied-world2-four-world-long-horizon
          path: |
            embodied2-ablation.json
            embodied2-ablation.log
            embodied2-agent.json
            embodied2-agent.log
          if-no-files-found: ignore
