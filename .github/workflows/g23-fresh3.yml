name: g23-fresh3
# First valid registered geometry-safe G23 qualification after pre-seal test-registration repair.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/g23-fresh3.yml']
permissions:
  contents: read
jobs:
  fresh3:
    if: >-
      github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'g23: execute frozen fresh3 compositional qualification'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify exact committed source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
      - name: G23 mechanism preflight
        run: cargo test --release --test g23_compositional_perceptual_function g23_synthesizes_composed_current_sensory_predicate_when_atoms_fail -- --nocapture
      - name: G22 regression
        run: cargo test --release --test g22_perceptual_variable_invention -- --nocapture
      - name: G21 regression
        run: cargo test --release --test g21_contextual_state_refinement g21_ -- --nocapture
      - name: G20 regression
        run: cargo test --release --test g20_continual_reasoning g20_ -- --nocapture
      - name: Human Protection regression
        run: cargo test --release --test human_protection -- --nocapture
      - name: Full ordinary regression suite
        run: cargo test --release --all --all-targets -- --nocapture
      - name: Release build
        run: cargo build --release
      - name: Explicit one-use FRESH-G23-3 qualification
        env:
          AETERNA_FRESH_SEED: ${{ github.run_id }}
          AETERNA_SOURCE_SHA: ${{ github.sha }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          export AETERNA_SPEC_SHA="$(git rev-parse HEAD:docs/G23_COMPOSITIONAL_PERCEPTUAL_FUNCTION_FRESH3_PROTOCOL.md)"
          set -o pipefail
          cargo test --release --test g23_compositional_perceptual_function g23_fresh3_compositional_perceptual_pack -- --ignored --nocapture | tee g23-fresh3-evidence.log
      - name: Preserve fresh3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g23-fresh3-evidence
          path: g23-fresh3-evidence.log
          if-no-files-found: ignore
          retention-days: 30
      - name: Verify tracked source unchanged
        if: always()
        run: git diff --exit-code
