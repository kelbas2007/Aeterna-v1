name: Apply LC1 V7 exact reviewed source
on:
  push:
    branches: [integration/lc1-central-20261018]
    paths: ['.ci/lc1/v7/**', '.github/workflows/lc1-v7-apply.yml']
permissions:
  contents: write
concurrency:
  group: lc1-v7-apply
  cancel-in-progress: true
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Reconstruct and verify exact patch
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 3140c18372443c52d1b0e466fb56d124cbff606a HEAD
          mkdir -p lc1-v7-evidence
          python - <<'PY'
          from pathlib import Path
          import base64,lzma,hashlib,subprocess
          d=Path('.ci/lc1/v7')
          encoded=b''.join((d/f'part{i}.txt').read_bytes() for i in range(5))
          assert len(encoded)==13224
          compressed=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(compressed).hexdigest()=='5343a498e0c45264b3d63f9a46dc308169c0bb3c69ff5a914f111d7f0d385d60'
          patch=lzma.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest()=='a22b654cd682a7279007ed39e49154e39eff68db3834be78227c93b799558dc5'
          before={
            'src/construction/requirements.rs':'0186edbb8e5f9a766bb121662f86a45be1c974a9',
            'src/construction/requirements_port.rs':'e9693b41aac7aab21d5d5ff46779aa88f8325258',
            'src/recursive_search_runtime.rs':'aaafc5c82dc98c16b0a0f7a96fdf36644783feed',
            'scripts/check_project.py':'6ed7088489ed5c9d08efe5edea5f0ba866b7f647',
            'docs/evidence/PROJECT_SOURCE_BINDING.json':'ceaefe012e7506f10fbd8e613190a33b56d82e91',
          }
          for path,sha in before.items():
            assert subprocess.check_output(['git','hash-object',path],text=True).strip()==sha,path
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          after={
            'src/construction/requirements.rs':'a7d56f308da3d1c8a72cc389ebdd7ac46cb42b9a',
            'src/construction/requirements_port.rs':'c73552a88f03c91facebc0b1c023761275fe9112',
            'src/recursive_search_runtime.rs':'9fa4e460ad3c3d8b6f52714da97c5f25126367e5',
            'scripts/check_project.py':'d846e66a2b54b2811d37f5cb0abd9a941f645332',
            'scripts/test_check_project_target.py':'b55d0b22da5442a80997667cec7f6e88d1eb2f8a',
            'tests/lc1_execution_contract.rs':'64839f35f8ceb67957bd6b6e1c97486669de78e0',
            'docs/evidence/PROJECT_SOURCE_BINDING.json':'0543f8eeed67d14b52970828a365c38689e5afce',
            'docs/LC1_REVIEW_V7_METERED_CONTRACT.md':'2b6a9eda8ae46db1babc83d985d96fab5c47ad4f',
          }
          for path,sha in after.items():
            assert subprocess.check_output(['git','hash-object',path],text=True).strip()==sha,path
          PY
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Bound LC1 VM input and charge measured work on every exit'
          git rev-parse HEAD > lc1-v7-evidence/tested-revision.txt
      - name: Rust 1.99
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup override set 1.99.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact-source regression checks
        shell: bash
        run: |
          set -euo pipefail
          python scripts/project_audit.py | tee lc1-v7-evidence/audit.log
          python scripts/check_docs.py | tee lc1-v7-evidence/docs.log
          python scripts/test_check_project_target.py | tee lc1-v7-evidence/custom-target.log
          cargo check --locked --all-targets 2>&1 | tee lc1-v7-evidence/check.log
          cargo test --locked --test lc1_execution_contract --test learned_requirements --test recursive_search_repair --test experiential --test unified_runtime --test human_protection 2>&1 | tee lc1-v7-evidence/tests.log
          cargo build --locked --bin aeterna-v1
          python scripts/lc1_joint_demo.py --binary target/debug/aeterna-v1 --output lc1-v7-evidence/demo.json | tee lc1-v7-evidence/demo.log
      - name: Publish exact passing code without workflow edits
        env:
          GH_TOKEN: \${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = integration/lc1-central-20261018
          git diff --exit-code
          header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$header"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" push origin HEAD:refs/heads/integration/lc1-central-20261018
          git rev-parse HEAD > lc1-v7-evidence/published-revision.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lc1-v7-\${{ github.sha }}
          path: lc1-v7-evidence/
          retention-days: 7
