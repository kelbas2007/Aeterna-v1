name: Format validated physical primitive binding once
on:
  push:
    branches: ['research/beyond-intel4']
    paths:
      - '.github/workflows/primitive-physical-format-once.yml'
permissions:
  contents: write
jobs:
  format-validated:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format only touched Rust sources
        run: |
          rustfmt --edition 2021 src/phase_primitives.rs src/phase_induction.rs src/phase_primitive_arguments.rs tests/primitive_argument_transfer.rs
          git diff --check
          cargo check --locked --all-targets
      - name: Check physical synapses and existing learned operations
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --release --test primitive_argument_transfer -- --nocapture 2>&1 | tee physically-bound.log
          grep -F 'PRIMITIVE_PHYSICAL_BINDINGS calls=2 source_definitions_unchanged=true query_no_fit=true checkpoint=true lesion=true restore=true' physically-bound.log
          grep -F 'PRIMITIVE_ARGUMENT_RUNTIME correct=48/48' physically-bound.log
      - name: Publish only format changes after verified tests and HEAD guard
        run: |
          set -euo pipefail
          git fetch origin research/beyond-intel4
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/phase_primitives.rs src/phase_induction.rs src/phase_primitive_arguments.rs tests/primitive_argument_transfer.rs
          git diff --cached --quiet && exit 0
          git commit -m 'style: rustfmt verified phase-native argument binding sources'
          git push origin HEAD:research/beyond-intel4
      - name: Preserve diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: primitive-physical-format-evidence
          path: physically-bound.log
          if-no-files-found: ignore
