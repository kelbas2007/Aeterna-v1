name: Functional grounded object action native diagnostic
on:
  push:
    branches: ['research/beyond-intel4']
    paths:
      - 'src/phase_grounded_objects.rs'
      - 'src/phase_unified_cognition.rs'
      - 'src/phase_native.rs'
      - 'src/scientific_runtime.rs'
      - 'tests/functional_grounding_native.rs'
      - '.github/workflows/functional-grounding-native.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  functional-grounding:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.0'}
      - uses: Swatinem/rust-cache@v2
      - name: Check full library and bins
        run: cargo check --locked --all-targets
      - name: Causally witness object-verb execution under U1
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --release --test functional_grounding_native -- --nocapture 2>&1 | tee functional-grounding-native.log
          grep -F 'FUNCTIONAL_GROUNDING_NATIVE_PASS' functional-grounding-native.log
      - name: Retain compilation and cognitive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-grounding-native-evidence
          path: functional-grounding-native.log
          if-no-files-found: ignore
