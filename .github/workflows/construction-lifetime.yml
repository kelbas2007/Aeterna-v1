name: Construction lifetime
on:
  push:
    branches: [research/beyond-intel4]
    paths: ['src/construction/**', 'src/bin/aeterna-construction.rs', 'tests/directed_construction*', 'examples/directed_construction*', 'scripts/construction_adapter_demo.py', '.github/workflows/construction-lifetime.yml', 'Cargo.toml', 'Cargo.lock']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: construction-lifetime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Rust and Cargo
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup override set 1.99.0
      - uses: Swatinem/rust-cache@v2
      - name: Compile and test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lifetime-evidence
          git rev-parse HEAD > lifetime-evidence/revision.txt
          { rustc --version --verbose; cargo --version; } > lifetime-evidence/toolchain.txt
          cargo check --locked --all-targets 2>&1 | tee lifetime-evidence/check.log
          cargo test --locked --lib construction:: 2>&1 | tee lifetime-evidence/unit.log
          for source in tests/directed_construction*.rs; do
            name=$(basename "$source" .rs)
            cargo test --locked --test "$name" 2>&1 | tee "lifetime-evidence/$name.log"
          done
          cargo test --locked --test human_protection --test online_learning --test induced_programs 2>&1 | tee lifetime-evidence/protection.log
      - name: Whole lifetime and external adapter
        shell: bash
        run: |
          set -euo pipefail
          for example in directed_construction directed_construction_recursive directed_construction_epistemic directed_construction_lifetime; do
            cargo run --locked --release --example "$example" > "lifetime-evidence/$example.json"
          done
          cargo build --locked --release --bin aeterna-construction
          python scripts/construction_adapter_demo.py --binary target/release/aeterna-construction --session "$RUNNER_TEMP/dc-lifetime-$GITHUB_RUN_ID" > lifetime-evidence/adapter.json
      - name: Keep small evidence, never target or live sessions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: construction-lifetime-${{ github.sha }}
          path: lifetime-evidence/
          retention-days: 7
