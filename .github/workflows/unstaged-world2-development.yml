# Manual diagnostic: repeatable native controls are covered by scripts/check.sh.
# Preserve original runs and score verdicts; ordinary pushes do not rescore them.
name: Unstaged world 2 - generic repetition arbitration
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  fresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env: {CARGO_BUILD_JOBS: 2, SDL_VIDEODRIVER: dummy}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.0'}
      - uses: Swatinem/rust-cache@v2
      - name: Install real Farama simulation
        run: python -m pip install 'minigrid==3.1.0'
      - name: Native causal checks and agent
        run: |
          cargo check --locked --all-targets
          cargo test --locked --release --test self_object_effect_native
          cargo build --locked --release --bin external_world_agent
      - name: Genuine unstaged cross-family independent seeds
        shell: bash
        run: |
          set -o pipefail
          python scripts/external_unstaged_world1.py \
            --agent target/release/external_world_agent \
            --seed-offset 2000 --output unstaged-world2.json \
            2>&1 | tee unstaged-world2.log
      - name: Check exact fresh seed set and factual score
        run: |
          python - <<'PY'
          import json
          result=json.load(open("unstaged-world2.json"))
          assert result["train_seeds"] == list(range(52000,52012))
          assert result["heldout_seeds"] == list(range(53000,53004))
          PY
          grep -F 'UNSTAGED_WORLD1_SUMMARY verdict=' unstaged-world2.log
      - name: Retain positive/negative metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unstaged-world2-generic-cooldown-evidence
          path: |
            unstaged-world2.json
            unstaged-world2.log
          if-no-files-found: ignore
