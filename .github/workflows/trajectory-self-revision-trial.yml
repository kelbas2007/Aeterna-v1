name: T-SR1 one-use self-revision qualification
on:
  pull_request:
    paths:
      - 'src/unified_runtime.rs'
      - 'tests/trajectory_self_revision_transfer.rs'
      - '.github/workflows/trajectory-self-revision-trial.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tsr1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin Rust and exact source
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.0 --profile minimal
          rustup override set 1.99.0
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
      - uses: Swatinem/rust-cache@v2
      - name: Confirm preregistered scientific protocol
        run: test -s docs/TRAJECTORY_SELF_REVISION_TRANSFER_PROTOCOL.md
      - name: Execute one-use generated-world scientific trial
        shell: bash
        run: |
          set -o pipefail
          mkdir -p project-evidence
          printf 'HEAD=%s\nRUN_ID=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" | tee project-evidence/t-sr1-provenance.txt
          cargo test --locked --test trajectory_self_revision_transfer -- --ignored --nocapture --test-threads=1 2>&1 | tee project-evidence/t-sr1-trial.log
      - name: Preserve both positive and negative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsr1-${{ github.sha }}-${{ github.run_id }}
          path: project-evidence/
          retention-days: 30
          if-no-files-found: warn
