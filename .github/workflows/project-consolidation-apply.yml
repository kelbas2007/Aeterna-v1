name: Apply verified project consolidation
on:
  push:
    branches: [integration/project-20261018]
    paths: ['.ci/project/**', '.github/workflows/project-consolidation-apply.yml']
permissions:
  contents: write
concurrency:
  group: project-consolidation-apply
  cancel-in-progress: true
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TERM_COLOR: never
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Apply exact checked patch and remove temporary installer
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 02b4175f34bcc68b8c80197cca6dd79f38b85892 HEAD
          python - <<'PY'
          from pathlib import Path
          import gzip,hashlib,subprocess
          raw=b''.join((Path('.ci/project')/f'part{i}.bin').read_bytes() for i in range(7))
          assert hashlib.sha256(raw).hexdigest()=='578ff73da55d76287cea725a1eb0a0742a39bcfb92077bd7ea0e5b0b94a3f0ed'
          patch=gzip.decompress(raw)
          assert hashlib.sha256(patch).hexdigest()=='7e9177ea1ceb09107cb2bb2b26ea1a20d2807f20b1a358667c26b850eac67d77'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          PY
          git rm -r .ci/project .github/workflows/project-consolidation-apply.yml
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Consolidate AETERNA entry point, RSP2 inventory, documentation and project verification'
          mkdir -p consolidation-evidence
          git rev-parse HEAD > consolidation-evidence/tested-revision.txt
          git archive --format=tar.gz --output=consolidation-evidence/source.tar.gz HEAD
      - name: Pinned Rust and Cargo
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup override set 1.99.0
          { rustc --version --verbose; cargo --version; } > consolidation-evidence/toolchain.txt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify unified application and unchanged cognitive source
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_project.py 2>&1 | tee consolidation-evidence/tests.log
          python scripts/check_docs.py 2>&1 | tee consolidation-evidence/docs.log
          python scripts/project_audit.py 2>&1 | tee consolidation-evidence/source-binding.json
          python scripts/project_demo.py --binary target/debug/aeterna-v1 --output consolidation-evidence/example 2>&1 | tee consolidation-evidence/example.log
      - name: Publish tested integration branch only, without force
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = integration/project-20261018
          git diff --exit-code
          header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$header"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" push origin HEAD:refs/heads/integration/project-20261018
          git rev-parse HEAD > consolidation-evidence/published-revision.txt
      - name: Preserve exact source and verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-consolidation-${{ github.sha }}
          path: consolidation-evidence/
          retention-days: 7
          if-no-files-found: warn
