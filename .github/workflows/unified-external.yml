name: Unified organism and external ARC-AGI-3
on:
  push:
    branches: [research/beyond-intel4]
    paths: ['src/unified*', 'src/construction/**', 'src/bin/aeterna-unified.rs', 'tests/unified*', 'examples/unified*', 'scripts/unified*', '.github/workflows/unified-external.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: unified-external-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact source without build artifacts
        run: |
          mkdir -p unified-evidence
          git rev-parse HEAD > unified-evidence/revision.txt
          git archive --format=tar.gz --output=unified-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: unified-source-${{ github.sha }}
          path: unified-source.tar.gz
          retention-days: 1
      - name: Rust and Cargo
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup override set 1.99.0
          { rustc --version --verbose; cargo --version; } > unified-evidence/toolchain.txt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official environment toolkit
        run: |
          python -m pip install arc-agi==0.9.9 > unified-evidence/python-install.log 2>&1
          python -m pip freeze > unified-evidence/python-versions.txt
      - name: Verify external environment access without inspecting game rules
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import arc_agi
          arc=arc_agi.Arcade()
          games=arc.get_environments()
          names=[g.game_id for g in games]
          env=arc.make('ls20',save_recording=False)
          if env is None: raise RuntimeError('Official ls20 environment unavailable')
          report={'kind':'setup_only','game_choice_frozen':'ls20','available_games':names,'action_space':[str(a) for a in env.action_space],'solver_steps':0,'game_source_read_by_agent':False}
          with open('unified-evidence/arc-setup.json','w') as f: json.dump(report,f,indent=2)
          PY
      - name: Compile integrated code
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --all-targets 2>&1 | tee unified-evidence/check.log
          if test -f tests/unified_runtime.rs; then
            cargo test --locked --test unified_runtime 2>&1 | tee unified-evidence/unified-tests.log
          fi
      - name: Learning and external run
        shell: bash
        run: |
          set -euo pipefail
          if test -f examples/unified_learning.rs; then
            cargo run --locked --example unified_learning > unified-evidence/learning.json
          fi
          if test -f scripts/unified_arc3.py; then
            cargo build --locked --bin aeterna-unified
            python scripts/unified_arc3.py --binary target/debug/aeterna-unified --game ls20 --max-actions 256 --output unified-evidence/arc3
          fi
      - name: Preserve bounded results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-results-${{ github.sha }}
          path: unified-evidence/
          retention-days: 7
          if-no-files-found: warn
