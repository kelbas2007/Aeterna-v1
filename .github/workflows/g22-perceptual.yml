name: g22-perceptual
# Manual-only after completed G22 mechanism verification; no fresh pack.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  perceptual:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify exact committed source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
      - name: G22 perceptual variable causal witness
        run: |
          set -o pipefail
          cargo test --release --test g22_perceptual_variable_invention -- --nocapture | tee g22-evidence.log
      - name: G21 representation refinement regression
        run: cargo test --release --test g21_contextual_state_refinement g21_ -- --nocapture
      - name: G20 integrated lifetime regression
        run: cargo test --release --test g20_continual_reasoning g20_ -- --nocapture
      - name: Human Protection regression
        run: cargo test --release --test human_protection -- --nocapture
      - name: Full ordinary regression suite
        run: cargo test --release --all --all-targets -- --nocapture
      - name: Release build
        run: cargo build --release
      - name: Preserve G22 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g22-evidence
          path: g22-evidence.log
          if-no-files-found: ignore
          retention-days: 30
      - name: Verify tracked source unchanged
        if: always()
        run: git diff --exit-code
