name: intel1-repair8
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/intel1-repair8.yml']
permissions:
  contents: read
jobs:
  repair8:
    if: >-
      github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'intel1: verify promoted context consensus'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Exact source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
      - name: Repair-8 promoted context consensus
        run: cargo test --release --test intel1_repair8_context_consensus intel1_repair8_ -- --nocapture
      - name: Repair-7 predecessor-conditioned coverage
        run: cargo test --release --test intel1_repair7_context_coverage intel1_repair7_ -- --nocapture
      - name: Repair-6 context-owned rival witness
        run: cargo test --release --test intel1_repair6_context_rival intel1_repair6_rival_probe_defers_when_context_side_is_oversampled -- --nocapture
      - name: Repair-5 direct balance witness
        run: cargo test --release --test intel1_repair5_context_balance intel1_repair5_stale_candidate_yields_when_current_side_is_oversampled -- --nocapture
      - name: Repair-4 competing context witness
        run: cargo test --release --test intel1_repair4_context_competition -- --nocapture
      - name: Repair-3 fanout witness
        run: cargo test --release --test intel1_repair3_fanout intel1_repair3_ -- --nocapture
      - name: Repair-1 bootstrap witness
        run: cargo test --release --test intel1_repair1_bootstrap -- --nocapture
      - name: Repair-2 frozen exploitation witness
        run: cargo test --release --test intel1_repair2_frozen_exploitation -- --nocapture
      - name: G21 context regression
        run: cargo test --release --test g21_contextual_state_refinement g21_ -- --nocapture
      - name: G22 regression
        run: cargo test --release --test g22_perceptual_variable_invention -- --nocapture
      - name: G23 regression
        run: cargo test --release --test g23_compositional_perceptual_function g23_synthesizes_composed_current_sensory_predicate_when_atoms_fail -- --nocapture
      - name: G20 persistent runtime regression
        run: cargo test --release --test g20_continual_reasoning g20_ -- --nocapture
      - name: Human Protection
        run: cargo test --release --test human_protection -- --nocapture
      - name: Release
        run: cargo build --release
      - name: Verify source unchanged
        if: always()
        run: git diff --exit-code
