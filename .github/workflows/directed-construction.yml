name: Directed construction regressions
on:
  push:
    branches: [main, research/beyond-intel4]
    paths: ['src/**', 'examples/directed_construction.rs', 'tests/directed_construction*', 'Cargo.toml', 'Cargo.lock', '.github/workflows/directed-construction.yml']
  pull_request:
    paths: ['src/**', 'examples/directed_construction.rs', 'tests/directed_construction*', 'Cargo.toml', 'Cargo.lock', '.github/workflows/directed-construction.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: directed-construction-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mechanism:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
      - uses: Swatinem/rust-cache@v2
      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA" && git diff --exit-code
      - name: Compile current source
        run: cargo check --locked --all-targets
      - name: Construction and protection controls
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --lib construction:: -- --nocapture 2>&1 | tee construction-tests.log
          cargo test --locked --test directed_construction_transfer -- --nocapture 2>&1 | tee transfer-tests.log
          cargo test --locked --test human_protection --test online_learning --test induced_programs 2>&1 | tee legacy-controls.log
      - name: Protected lifetime and frozen transfer controls
        run: cargo run --locked --example directed_construction > construction-demo.json
      - name: Preserve small development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directed-construction-${{ github.sha }}
          path: |
            construction-tests.log
            transfer-tests.log
            legacy-controls.log
            construction-demo.json
          retention-days: 7
          if-no-files-found: ignore
