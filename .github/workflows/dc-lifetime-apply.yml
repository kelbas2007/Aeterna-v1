name: Integrate autonomous construction lifetime
on:
  push:
    branches: [research/beyond-intel4]
    paths: ['.ci/lifetime/**', '.github/workflows/dc-lifetime-apply.yml']
permissions:
  contents: write
concurrency:
  group: dc-lifetime-apply-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      revision: ${{ steps.publish.outputs.revision }}
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Rust and Cargo
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt
          rustup override set 1.99.0
      - uses: Swatinem/rust-cache@v2
      - name: Integrate against exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'research/beyond-intel4'
          python .ci/lifetime/apply.py
          cp .ci/lifetime/workflow.yml .github/workflows/construction-lifetime.yml
          rustfmt --edition 2021 src/construction/autonomy.rs src/construction/session.rs src/bin/aeterna-construction.rs tests/directed_construction_unified.rs tests/directed_construction_session.rs examples/directed_construction_lifetime.rs
          git rm -r .ci/lifetime .github/workflows/dc-lifetime-apply.yml .github/workflows/dc-offline-tools.yml
          git add src/construction src/bin/aeterna-construction.rs tests/directed_construction_unified.rs tests/directed_construction_session.rs examples/directed_construction_lifetime.rs scripts/construction_adapter_demo.py .github/workflows/construction-lifetime.yml
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Complete bounded autonomous construction loop and persistent external-process runtime'
          mkdir -p lifetime-evidence
          git rev-parse HEAD > lifetime-evidence/revision.txt
          { rustc --version --verbose; cargo --version; } > lifetime-evidence/toolchain.txt
          sha256sum src/construction/*.rs src/bin/aeterna-construction.rs tests/directed_construction*.rs examples/directed_construction*.rs scripts/construction_adapter_demo.py > lifetime-evidence/source-sha256.txt
          git archive --format=tar.gz --output=lifetime-source.tar.gz HEAD
      - name: Compile and test actual integrated source
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --all-targets 2>&1 | tee lifetime-evidence/check.log
          cargo test --locked --lib construction:: 2>&1 | tee lifetime-evidence/unit.log
          for source in tests/directed_construction*.rs; do
            name=$(basename "$source" .rs)
            cargo test --locked --test "$name" 2>&1 | tee "lifetime-evidence/$name.log"
          done
          cargo test --locked --test human_protection --test online_learning --test induced_programs 2>&1 | tee lifetime-evidence/protection.log
      - name: Execute lifetime and compatibility demonstrations
        shell: bash
        run: |
          set -euo pipefail
          for example in directed_construction directed_construction_recursive directed_construction_epistemic directed_construction_lifetime; do
            cargo run --locked --release --example "$example" > "lifetime-evidence/$example.json"
          done
          cargo build --locked --release --bin aeterna-construction
          python scripts/construction_adapter_demo.py --binary target/release/aeterna-construction --session "$RUNNER_TEMP/dc-live-$GITHUB_RUN_ID" > lifetime-evidence/adapter.json
      - name: Publish only tested fast-forward commit
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$header"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" push origin HEAD:refs/heads/research/beyond-intel4
          revision=$(git rev-parse HEAD)
          printf '%s\n' "$revision" > lifetime-evidence/published-revision.txt
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Retain bounded evidence and exact source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifetime-integration-${{ github.sha }}
          path: |
            lifetime-evidence/
            lifetime-source.tar.gz
          retention-days: 7
          if-no-files-found: warn
  windows:
    needs: integrate
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.revision }}
          persist-credentials: false
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set 1.99.0
      - uses: Swatinem/rust-cache@v2
      - name: Check real Windows process and storage behavior
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force windows-evidence | Out-Null
          git rev-parse HEAD | Out-File windows-evidence/revision.txt
          cargo test --locked --test directed_construction_session --test directed_construction_unified 2>&1 | Tee-Object windows-evidence/tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --release --bin aeterna-construction 2>&1 | Tee-Object windows-evidence/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/construction_adapter_demo.py --binary target/release/aeterna-construction.exe --session "$env:RUNNER_TEMP/dc-windows-$env:GITHUB_RUN_ID" | Out-File -Encoding utf8 windows-evidence/adapter.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve Windows executable and verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aeterna-construction-windows-${{ needs.integrate.outputs.revision }}
          path: |
            target/release/aeterna-construction.exe
            windows-evidence/
          retention-days: 7
          if-no-files-found: warn
