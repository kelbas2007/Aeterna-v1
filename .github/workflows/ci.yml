name: evo-ci

on:
  workflow_dispatch:
  push:
    branches:
      - genesis/full-evophase

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Normalize formatting in ephemeral workspace
        run: cargo fmt --all
      - name: R1 mechanism metrics
        run: cargo test --test r1_robust_perception -- --nocapture
      - name: R1 whole-chain development metrics
        run: cargo test --test g7_open_world r1_ -- --nocapture
      - name: Regression tests
        run: cargo test --all --all-targets
      - name: Release build
        run: cargo build --release
