name: evo-ci
# Manual-only between sealed qualification checkpoints.

on:
  workflow_dispatch:
    inputs:
      qualify_p1:
        description: 'Consume a new one-use P1 qualification pack'
        required: false
        default: false
        type: boolean
      qualify_p2:
        description: 'Consume a new one-use P2 qualification pack'
        required: false
        default: false
        type: boolean
      qualify_p3:
        description: 'Consume a new one-use P3 autonomous qualification pack'
        required: false
        default: false
        type: boolean
      qualify_p4:
        description: 'Consume a new one-use P4 learned-drive qualification pack'
        required: false
        default: false
        type: boolean
      qualify_p5:
        description: 'Consume a new one-use P5 continual-retention qualification pack'
        required: false
        default: false
        type: boolean
      qualify_g10:
        description: 'Consume a new one-use G10 composite-concept qualification pack'
        required: false
        default: false
        type: boolean
      qualify_g10_phys:
        description: 'Consume a new one-use G10-PHYS phase-native concept qualification pack'
        required: false
        default: false
        type: boolean
      qualify_g11:
        description: 'Consume a new one-use G11 recursive-abstraction qualification pack'
        required: false
        default: false
        type: boolean
permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify exact source without workspace rewrites
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
      - name: P5 fast continual diagnostic
        run: cargo test --release --test phase_native_continual -- --nocapture
      - name: Full optimized regression suite including P1 and P2 interventions
        run: cargo test --release --all --all-targets -- --nocapture
      - name: Release build
        run: cargo build --release
      - name: Explicit one-use fresh P1 bounded qualification
        if: ${{ inputs.qualify_p1 }}
        env:
          AETERNA_FRESH_SEED: ${{ github.run_id }}
          AETERNA_SOURCE_SHA: ${{ github.sha }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          export AETERNA_SPEC_SHA="$(git rev-parse HEAD:docs/PHASE_NATIVE_P1_PROTOCOL.md)"
          cargo test --release --test phase_native_execution p1_fresh_bounded_shared_cell_pack -- --ignored --nocapture
      - name: Explicit one-use fresh P2 qualification
        if: ${{ inputs.qualify_p2 }}
        env:
          AETERNA_FRESH_SEED: ${{ github.run_id }}
          AETERNA_SOURCE_SHA: ${{ github.sha }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          export AETERNA_SPEC_SHA="$(git rev-parse HEAD:docs/PHASE_NATIVE_P2_PROTOCOL.md)"
          set -o pipefail
          cargo test --release --test phase_forward_execution p2_fresh_forward_and_integrated_pack -- --ignored --nocapture | tee p2-evidence.log
      - name: Explicit one-use fresh P3 autonomous qualification
        if: ${{ inputs.qualify_p3 }}
        env:
          AETERNA_FRESH_SEED: ${{ github.run_id }}
          AETERNA_SOURCE_SHA: ${{ github.sha }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          export AETERNA_SPEC_SHA="$(git rev-parse HEAD:docs/PHASE_NATIVE_P3_FRESH_PROTOCOL.md)"
          set -o pipefail
          cargo test --release --test phase_native_autonomy p3_fresh_autonomous_acquisition_pack -- --ignored --nocapture | tee p3-evidence.log
      - name: Explicit one-use fresh P4 learned-drive qualification
        if: ${{ inputs.qualify_p4 }}
        env:
          AETERNA_FRESH_SEED: ${{ github.run_id }}
          AETERNA_SOURCE_SHA: ${{ github.sha }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          export AETERNA_SPEC_SHA="$(git rev-parse HEAD:docs/PHASE_NATIVE_P4_FRESH_PROTOCOL.md)"
          set -o pipefail
          cargo test --release --test phase_native_learned_drive p4_fresh_learned_drive_transfer_pack -- --ignored --nocapture | tee p4-evidence.log
      - name: Explicit one-use fresh P5 continual-retention qualification
        if: ${{ inputs.qualify_p5 }}
        env:
          AETERNA_FRESH_SEED: ${{ github.run_id }}
          AETERNA_SOURCE_SHA: ${{ github.sha }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          export AETERNA_SPEC_SHA="$(git rev-parse HEAD:docs/PHASE_NATIVE_P5_FRESH_PROTOCOL.md)"
          set -o pipefail
          cargo test --release --test phase_native_continual p5_fresh_continual_retention_pack -- --ignored --nocapture | tee p5-evidence.log
      - name: Explicit one-use fresh G10 composite-concept qualification
        if: ${{ inputs.qualify_g10 }}
        env:
          AETERNA_FRESH_SEED: ${{ github.run_id }}
          AETERNA_SOURCE_SHA: ${{ github.sha }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          export AETERNA_SPEC_SHA="$(git rev-parse HEAD:docs/G10_COMPOSITE_CONCEPT_FRESH_PROTOCOL.md)"
          set -o pipefail
          cargo test --release --test g10_composite_concept g10_fresh_composite_concept_pack -- --ignored --nocapture | tee g10-evidence.log
      - name: Explicit one-use fresh G10-PHYS qualification
        if: ${{ inputs.qualify_g10_phys }}
        env:
          AETERNA_FRESH_SEED: ${{ github.run_id }}
          AETERNA_SOURCE_SHA: ${{ github.sha }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          export AETERNA_SPEC_SHA="$(git rev-parse HEAD:docs/G10_PHASE_NATIVE_CONCEPT_FRESH_PROTOCOL.md)"
          set -o pipefail
          cargo test --release --test g10_phase_native_concept g10_fresh_phase_native_concept_pack -- --ignored --nocapture | tee g10-phys-evidence.log
      - name: Explicit one-use fresh G11 recursive-abstraction qualification
        if: ${{ inputs.qualify_g11 }}
        env:
          AETERNA_FRESH_SEED: ${{ github.run_id }}
          AETERNA_SOURCE_SHA: ${{ github.sha }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          export AETERNA_SPEC_SHA="$(git rev-parse HEAD:docs/G11_RECURSIVE_ABSTRACTION_FRESH_PROTOCOL.md)"
          set -o pipefail
          cargo test --release --test g11_recursive_abstraction g11_fresh_recursive_abstraction_pack -- --ignored --nocapture | tee g11-evidence.log
      - name: Preserve G11 execution log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g11-execution-evidence
          path: g11-evidence.log
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve G10-PHYS execution log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g10-phys-execution-evidence
          path: g10-phys-evidence.log
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve G10 execution log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g10-execution-evidence
          path: g10-evidence.log
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve P5 execution log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5-execution-evidence
          path: p5-evidence.log
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve P4 execution log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p4-execution-evidence
          path: p4-evidence.log
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve P3 execution log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-execution-evidence
          path: p3-evidence.log
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve P2 execution log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-execution-evidence
          path: p2-evidence.log
          if-no-files-found: ignore
          retention-days: 30
      - name: Verify tested tracked source was not rewritten
        if: always()
        run: git diff --exit-code
