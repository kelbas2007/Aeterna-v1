name: evo-ci

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Normalize formatting in ephemeral workspace
        run: cargo fmt --all
      - name: Test
        run: cargo test --all --all-targets
      - name: Release build
        run: cargo build --release
