name: evo-ci

on:
  workflow_dispatch:
  push:
    branches:
      - genesis/full-evophase

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Normalize formatting in ephemeral workspace
        run: cargo fmt --all
      - name: Regression tests
        run: cargo test --all --all-targets
      - name: Seal fresh G7 spec
        run: echo "AETERNA_SPEC_SHA=$(git rev-parse HEAD:docs/G7_OPEN_WORLD_PROTOCOL.md)" >> "$GITHUB_ENV"
      - name: Fresh G7 whole-organism qualification
        env:
          AETERNA_FRESH_SEED: ${{ github.run_id }}
          AETERNA_SOURCE_SHA: ${{ github.sha }}
        run: cargo test --test g7_open_world fresh_g7_whole_organism_pack -- --ignored --nocapture
      - name: Release build
        run: cargo build --release
