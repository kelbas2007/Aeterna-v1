name: evo-ci

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Normalize formatting in ephemeral workspace
        run: cargo fmt --all
      - name: Regression tests
        run: cargo test --all --all-targets
      - name: G8 mechanism witness
        run: cargo test --test g8_imagined_planning -- --nocapture
      - name: Release build
        run: cargo build --release
