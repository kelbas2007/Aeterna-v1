name: evo-ci

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Normalize formatting in ephemeral workspace
        run: cargo fmt --all
      - name: Phase-execution dependency diagnostic (not an ownership PASS)
        run: |
          echo "AUDIT_SOURCE_SHA=$GITHUB_SHA"
          echo "AUDIT_SPEC_SHA=$(git rev-parse HEAD:docs/PHASE_EXECUTION_AUDIT.md)"
          cargo test --test phase_execution_dependency -- --nocapture
      - name: Regression tests
        run: cargo test --all --all-targets
      - name: Release build
        run: cargo build --release
