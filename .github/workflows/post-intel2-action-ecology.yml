name: post-INTEL2 action ecology verification

on:
  push:
    branches:
      - post-intel2-action-ecology
    paths:
      - 'src/**'
      - 'tests/**'
      - 'docs/POST_INTEL2_ACTION_ECOLOGY_PROTOCOL.md'
      - '.github/workflows/post-intel2-action-ecology.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: U1 meta-control
        run: cargo test --release --test u1_meta_control
      - name: U1 runtime integration
        run: cargo test --release --test u1_runtime_integration
      - name: U2 ecology
        run: cargo test --release --test u2_hypothesis_ecology
      - name: U3 allocation
        run: cargo test --release --test u3_cross_mechanism_allocation
      - name: Unified runtime
        run: cargo test --release --test unified_runtime_integration
      - name: G20
        run: cargo test --release --test g20_continual_reasoning
      - name: G21
        run: cargo test --release --test g21_contextual_state_refinement
      - name: G22
        run: cargo test --release --test g22_perceptual_variable_invention
      - name: G23
        run: cargo test --release --test g23_compositional_perceptual_function
      - name: Human Protection
        run: cargo test --release --test human_protection
      - name: Release
        run: cargo build --release
