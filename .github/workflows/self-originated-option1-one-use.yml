name: SELF-ORIGINATED-OPTION1 one-use cold science
on:
  pull_request:
    paths:
      - 'tests/self_originated_option1_one_use.rs'
      - '.github/workflows/self-originated-option1-one-use.yml'
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: one-use-self-option1-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  first-use:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
    steps:
      - name: Do not rerun exposed seed or source
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import json,os,urllib.request
          repo=os.environ["GITHUB_REPOSITORY"]
          current=int(os.environ["GITHUB_RUN_ID"])
          branch=os.environ["GITHUB_HEAD_REF"]
          url=("https://api.github.com/repos/"+repo+
               "/actions/workflows/self-originated-option1-one-use.yml/runs?event=pull_request&per_page=100")
          req=urllib.request.Request(url,headers={
              "Authorization":"Bearer "+os.environ["GH_TOKEN"],
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28"})
          with urllib.request.urlopen(req,timeout=20) as response:
              data=json.load(response)
          scoped=[int(r["id"]) for r in data.get("workflow_runs",[])
                  if r.get("head_branch")==branch]
          if not scoped:
              raise RuntimeError("No first-run provenance found: fail closed")
          first=min(scoped)
          allowed=(first==current)
          print(json.dumps({"current_run":current,"earliest_run":first,
                            "first_science_attempt":allowed}))
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write("first="+("true" if allowed else "false")+"\n")
          PY
      - uses: actions/checkout@v4
        if: steps.guard.outputs.first == 'true'
        with:
          persist-credentials: false
      - name: Exact Rust source and one-use seed
        if: steps.guard.outputs.first == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.0 --profile minimal
          rustup override set 1.99.0
          mkdir -p self-option-science
          git rev-parse HEAD > self-option-science/exact_test_merge_sha.txt
          echo "$GITHUB_RUN_ID" > self-option-science/one_use_seed.txt
      - uses: Swatinem/rust-cache@v2
        if: steps.guard.outputs.first == 'true'
      - name: Execute frozen independent-within-synthetic benchmark
        if: steps.guard.outputs.first == 'true'
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --test self_originated_option1_one_use -- --ignored --nocapture --test-threads=1 2>&1 | tee self-option-science/science.log
          python scripts/project_audit.py | tee self-option-science/source-audit.json
      - name: Archive all REAL positive and negative episode traces
        if: always() && steps.guard.outputs.first == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: one-use-self-originated-option1-${{ github.run_id }}
          path: self-option-science/
          retention-days: 30
          if-no-files-found: warn
