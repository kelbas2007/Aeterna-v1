name: Apply LC1 central acquisition and verify
on:
  push:
    branches: [integration/lc1-central-20261018]
    paths:
      - '.ci/lc1/**'
      - '.github/workflows/lc1-integration-apply.yml'
permissions:
  contents: write
concurrency:
  group: lc1-central-install-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate frozen patch and create tested working tree
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 7e83fadd813c9132ba8231c73e1fb80b61f8b515 HEAD
          git merge-base --is-ancestor 4bd5b9dde5ea5977029bfb003181d68e32964f2a HEAD
          python - <<'PY'
          from pathlib import Path
          import gzip,hashlib,subprocess
          compressed=Path('.ci/lc1/change.patch.gz').read_bytes()
          assert hashlib.sha256(compressed).hexdigest()=='1faadf1d31a3d51e98eb1fdb4a685295603b61d50249ef0582ff140977bc0616'
          patch=gzip.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest()=='a0dda8556ffb8ccde6b2efb75063be7dfd202f6c0a74d161d91ca820757cc153'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          PY
          git rm .ci/lc1/change.patch.gz
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Integrate LC1 learned requirements in unified RSP3/RSP2 Learner'
          mkdir -p lc1-evidence
          git rev-parse HEAD > lc1-evidence/tested-revision.txt
          git archive --format=tar.gz -o lc1-evidence/source.tar.gz HEAD
          sha256sum src/construction/requirements.rs src/construction/requirements_port.rs src/construction/runtime.rs src/construction/search_policy.rs > lc1-evidence/source-hashes.txt
      - name: Pinned Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup override set 1.99.0
          { rustc --version --verbose; cargo --version; } > lc1-evidence/toolchain.txt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source binding, documentation, and focused LC1/RSP2 regressions
        shell: bash
        run: |
          set -euo pipefail
          python scripts/project_audit.py | tee lc1-evidence/source-audit.json
          python scripts/check_docs.py | tee lc1-evidence/documentation.log
          cargo check --locked --all-targets 2>&1 | tee lc1-evidence/check.log
          cargo test --locked --test learned_requirements --test recursive_search_repair --test experiential --test unified_runtime --test human_protection 2>&1 | tee lc1-evidence/integration-tests.log
          cargo build --locked --bin aeterna-v1 2>&1 | tee lc1-evidence/build.log
          python scripts/lc1_joint_demo.py --binary target/debug/aeterna-v1 --output lc1-evidence/joint-demo.json 2>&1 | tee lc1-evidence/demo.log
      - name: Full project integration checks
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_project.py 2>&1 | tee lc1-evidence/project-checks.log
      - name: Publish tested source without rewriting main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'integration/lc1-central-20261018'
          git diff --exit-code
          header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$header"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" push origin HEAD:refs/heads/integration/lc1-central-20261018
          git rev-parse HEAD > lc1-evidence/published-revision.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LC1-central-integration-${{ github.sha }}
          path: lc1-evidence/
          retention-days: 7
          if-no-files-found: warn
