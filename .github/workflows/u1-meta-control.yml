name: u1-meta-control
# Clean U1 rerun with genuine simultaneous mixed-proposal integration witness.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  u1:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Exact source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
      - name: U1 carrier-owned meta-control
        run: |
          set -o pipefail
          cargo test --release --test u1_meta_control -- --nocapture | tee u1-evidence.log
      - name: U1 real-mechanism runtime integration
        run: cargo test --release --test u1_runtime_integration u1_runtime_ -- --nocapture
      - name: G20 persistent runtime regression
        run: cargo test --release --test g20_continual_reasoning g20_ -- --nocapture
      - name: G21 regression
        run: cargo test --release --test g21_contextual_state_refinement g21_ -- --nocapture
      - name: G22 regression
        run: cargo test --release --test g22_perceptual_variable_invention -- --nocapture
      - name: G23 regression
        run: cargo test --release --test g23_compositional_perceptual_function g23_synthesizes_composed_current_sensory_predicate_when_atoms_fail -- --nocapture
      - name: Human Protection
        run: cargo test --release --test human_protection -- --nocapture
      - name: Release build
        run: cargo build --release
      - name: Preserve U1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: u1-evidence
          path: u1-evidence.log
          if-no-files-found: ignore
          retention-days: 30
      - name: Verify source unchanged
        if: always()
        run: git diff --exit-code
