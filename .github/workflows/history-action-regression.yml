name: History action execution regression
on:
  pull_request:
    paths:
      - 'src/construction/**'
      - 'src/unified_runtime.rs'
      - 'tests/predictive_history*'
      - '.github/workflows/history-action-regression.yml'
permissions:
  contents: read
concurrency:
  group: history-action-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pinned toolchain and baseline source
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.0 --profile minimal
          rustup override set 1.99.0
          git fetch --depth=1 origin 04be74ad500160673063be212cb2a43f3845b13c
          mkdir -p history-evidence
          git rev-parse HEAD > history-evidence/head.txt
      - uses: Swatinem/rust-cache@v2
      - name: Reproduce original continuation failure without accepting build errors
        shell: bash
        run: |
          set -euo pipefail
          path=src/construction/unified_port.rs
          trap 'git checkout HEAD -- src/construction/unified_port.rs' EXIT
          git show 04be74ad500160673063be212cb2a43f3845b13c:$path > "$path"
          set +e
          cargo test --locked --test predictive_history_action_development prepared_context -- --nocapture > history-evidence/baseline.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -q 'history remainder must' history-evidence/baseline.log
          git checkout HEAD -- "$path"
          trap - EXIT
          git diff --exit-code
      - name: Verify fixed execution, contradiction, safety and existing history contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --test predictive_history_action_development --test predictive_history_state_development -- --nocapture --test-threads=1 2>&1 | tee history-evidence/fixed.log
          python scripts/project_audit.py | tee history-evidence/source-binding.json
      - name: Preserve complete positive and negative development traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-action-${{ runner.os }}-${{ github.sha }}
          path: history-evidence/
          retention-days: 7
          if-no-files-found: warn
