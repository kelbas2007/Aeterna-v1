name: Semantic development toolchain
on:
  push:
    branches: [research/beyond-intel4]
    paths: ['.github/workflows/semantic-bootstrap.yml']
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export pinned compiler and vendored dependencies
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.0 --profile minimal
          rustup override set 1.99.0
          mkdir -p offline
          cargo vendor --locked offline/vendor > offline/config.toml
          toolchain=$(rustc --print sysroot)
          mkdir -p offline/rust
          cp -a "$toolchain/bin" "$toolchain/lib" offline/rust/
          rm -f offline/rust/bin/rustdoc
          git rev-parse HEAD > offline/revision.txt
          git archive --format=tar.gz --output=offline/source.tar.gz HEAD
          tar -czf rust-offline.tar.gz offline
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-rust-offline
          path: rust-offline.tar.gz
          retention-days: 1
