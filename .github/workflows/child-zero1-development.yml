# Manual diagnostic: repeatable native controls are covered by scripts/check.sh.
# Preserve original runs and score verdicts; ordinary pushes do not rescore them.
name: Child Zero 1 - innate priors and episode memory vs identical learner
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  child-zero:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env: {CARGO_BUILD_JOBS: 2, SDL_VIDEODRIVER: dummy}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.0'}
      - uses: Swatinem/rust-cache@v2
      - name: Independent Farama physics
        run: python -m pip install 'minigrid==3.1.0'
      - name: Compile CPU-first organism and causal newborn priors
        run: |
          cargo check --locked --all-targets
          cargo test --locked --release --test innate_scaffold_native
          cargo test --locked --release --test general_policy_native
          cargo build --locked --release --bin external_world_agent
      - name: Generic learned policy without newborn priors, SAME seeds
        shell: bash
        run: |
          set -o pipefail
          python scripts/external_unstaged_world1.py \
            --agent target/release/external_world_agent \
            --general-policy --budget 256 --include-empty --seed-offset 22000 \
            --output child-zero-ablation.json 2>&1 | tee child-zero-ablation.log
      - name: Innate physical learning priors and lived experience memory
        shell: bash
        run: |
          set -o pipefail
          python scripts/external_unstaged_world1.py \
            --agent target/release/external_world_agent \
            --general-policy --innate-scaffold --developmental-memory \
            --budget 256 --include-empty --seed-offset 22000 \
            --output child-zero-agent.json 2>&1 | tee child-zero-agent.log
      - name: Score actual full task completion without tuning
        run: |
          python - <<'PY'
          import json
          a=json.load(open('child-zero-ablation.json'))
          b=json.load(open('child-zero-agent.json'))
          assert a['train_seeds']==b['train_seeds']==list(range(72000,72012))
          assert a['heldout_seeds']==b['heldout_seeds']==list(range(73000,73004))
          assert not a['innate_scaffold'] and not a['developmental_memory']
          assert b['innate_scaffold'] and b['developmental_memory']
          assert a['general_policy'] and b['general_policy']
          assert a['budget']==b['budget']==256 and a['worlds']==b['worlds']
          assert a['total_physical_actions']>0 and b['total_physical_actions']>0
          assert a['random_task_successes']==b['random_task_successes']
          complex_goals=b['heldout_successes_by_world']['MiniGrid-DoorKey-5x5-v0']+b['heldout_successes_by_world']['MiniGrid-MultiRoom-N2-S4-v0']
          passed=b['eval_task_successes']>=6 and b['eval_task_successes']>a['eval_task_successes'] and b['eval_task_successes']>b['random_task_successes'] and complex_goals>0
          print('CHILD_ZERO1_REAL_TASKS '
                f"child={b['eval_task_successes']}/16 "
                f"no_innate={a['eval_task_successes']}/16 "
                f"random={b['random_task_successes']}/16 "
                f"child_training={b['train_task_successes']}/48 "
                f"per_world={b['heldout_successes_by_world']} "
                f"innate_events={b['innate_acquired_events']} "
                f"trained_reward_events={b['general_training_rewards']} "
                f"verdict={'DEVELOPMENT_PASS' if passed else 'DEVELOPMENT_FAIL'}")
          PY
      - name: Always retain complete external results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: child-zero1-matched-world-physics
          path: |
            child-zero-ablation.json
            child-zero-ablation.log
            child-zero-agent.json
            child-zero-agent.log
          if-no-files-found: ignore
