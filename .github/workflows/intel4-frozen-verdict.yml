name: INTEL-4 frozen whole-organism verdict

on:
  workflow_dispatch:
  push:
    branches:
      - intel4-frozen-unified
    paths:
      - '.intel4_authority_trigger'

concurrency:
  group: intel4-frozen-authority
  cancel-in-progress: false

jobs:
  intel4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Verify attempt one and frozen source + evaluator
        shell: bash
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          git fetch origin c7b5455ba006b297288fa8d16ef6300c8a19ceca --depth=1 || true
          git fetch origin a31e815a6565d1719028cd4e585c52b78759e323 --depth=1 || true
          git diff --exit-code c7b5455ba006b297288fa8d16ef6300c8a19ceca -- src Cargo.toml Cargo.lock
          git diff --exit-code a31e815a6565d1719028cd4e585c52b78759e323 -- tests/intel4_unified_worlds.rs

      - name: Pre-seal evaluator and scientific regressions
        shell: bash
        run: |
          cargo test --release --test intel4_unified_worlds intel4_evaluator_uses_only_unified_external_runtime
          cargo test --release --test e_model_revalidation e_model_revalidation_depends_on_factual_local_support
          cargo test --release --test e_model_revalidation e_goal_route_coverage_comes_from_acquired_physical_successors
          cargo test --release --test composition_succession composition_replaces_rejected
          cargo test --release --test g20_continual_reasoning
          cargo test --release --test g21_contextual_state_refinement
          cargo test --release --test g22_perceptual_variable_invention
          cargo test --release --test g23_compositional_perceptual_function g23_synthesizes_composed
          cargo test --release --test u1_meta_control
          cargo test --release --test u2_hypothesis_ecology
          cargo test --release --test u3_cross_mechanism_allocation
          cargo test --release --test human_protection
          cargo build --release

      - name: Execute one-use sealed INTEL-4 target lifetime
        shell: bash
        env:
          AETERNA_INTEL4_SEED: ${{ github.run_id }}
          AETERNA_SOURCE_SHA: ${{ github.sha }}
        run: |
          export AETERNA_SPEC_SHA="$(git rev-parse HEAD:docs/INTEL4_PROTOCOL.md)"
          set -o pipefail
          cargo test --release --test intel4_unified_worlds intel4_frozen_unified_fresh_lifetime -- --nocapture | tee intel4-evidence.log

      - name: Preserve burned-pack scientific evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intel4-evidence
          path: intel4-evidence.log
          if-no-files-found: warn

      - name: Verify cognitive and evaluator source still frozen
        if: always()
        shell: bash
        run: |
          git fetch origin c7b5455ba006b297288fa8d16ef6300c8a19ceca --depth=1 || true
          git fetch origin a31e815a6565d1719028cd4e585c52b78759e323 --depth=1 || true
          git diff --exit-code c7b5455ba006b297288fa8d16ef6300c8a19ceca -- src Cargo.toml Cargo.lock
          git diff --exit-code a31e815a6565d1719028cd4e585c52b78759e323 -- tests/intel4_unified_worlds.rs
