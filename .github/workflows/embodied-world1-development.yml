# Manual diagnostic: repeatable native controls are covered by scripts/check.sh.
# Preserve original runs and score verdicts; ordinary pushes do not rescore them.
name: Embodied-world 1 - paired outside navigation vs unchanged ablation
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  real-world-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env: {CARGO_BUILD_JOBS: 2, SDL_VIDEODRIVER: dummy}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.0'}
      - uses: Swatinem/rust-cache@v2
      - name: Install real independent Farama simulation
        run: python -m pip install 'minigrid==3.1.0'
      - name: Compile native carrier and execute regression smoke tests
        run: |
          cargo check --locked --all-targets
          cargo test --locked --release --test self_object_effect_native
          cargo build --locked --release --bin external_world_agent
      - name: Paired ABLATED self-object baseline, same outside worlds
        shell: bash
        run: |
          set -o pipefail
          python scripts/external_unstaged_world1.py \
            --agent target/release/external_world_agent \
            --seed-offset 4000 --output embodied-ablation.json \
            2>&1 | tee embodied-ablation.log
      - name: Embodied optics learning with exact matched physical seeds
        shell: bash
        run: |
          set -o pipefail
          python scripts/external_unstaged_world1.py \
            --agent target/release/external_world_agent \
            --embodied --seed-offset 4000 \
            --output embodied-world1.json \
            2>&1 | tee embodied-world1.log
      - name: Compare factual reward/movement against ablation and random
        shell: bash
        run: |
          python - <<'PY'
          import json
          b=json.load(open("embodied-ablation.json"))
          e=json.load(open("embodied-world1.json"))
          assert b["heldout_seeds"]==e["heldout_seeds"]==list(range(55000,55004))
          assert b["train_seeds"]==e["train_seeds"]==list(range(54000,54012))
          assert not b["embodied_navigation"] and e["embodied_navigation"]
          assert b["total_physical_actions"]>0 and e["total_physical_actions"]>0
          assert b["random_task_successes"]==e["random_task_successes"]
          print("EMBODIED_PAIR_RESULT "
                f"ablated_tasks={b['eval_task_successes']}/12 "
                f"embodied_tasks={e['eval_task_successes']}/12 "
                f"random={e['random_task_successes']}/12 "
                f"ablated_moves={b['eval_executed_moves']} "
                f"embodied_moves={e['eval_executed_moves']} "
                f"optic_shifts={e['native_inferred_motion_events']} "
                f"key_pickups={e['eval_key_pickups']} "
                f"doors={e['eval_door_openings']} "
                f"verdict={'DEVELOPMENT_PASS' if e['verdict']=='DEVELOPMENT_PASS' and e['eval_task_successes']>b['eval_task_successes'] else 'DEVELOPMENT_FAIL'}")
          PY
      - name: Keep both errors and first scientific evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: embodied-world1-paired-real-external-evidence
          path: |
            embodied-ablation.json
            embodied-ablation.log
            embodied-world1.json
            embodied-world1.log
          if-no-files-found: ignore
