name: RSP3 experiential proposal verified installer
on:
  push:
    branches: ['research/rsp3-experience-20261018']
    paths: ['.ci/rsp3/**', '.github/workflows/rsp3-proposal-apply.yml']
permissions:
  contents: write
concurrency:
  group: rsp3-proposal-apply
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TERM_COLOR: never
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Apply exact patch from checked base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rsp3-evidence
          if test -f .ci/rsp3/change.patch.gz; then
            test "$(git rev-parse HEAD^ 2>/dev/null || true)" != '6bb3bf83cb9eeb977dea0dec49b9e24ed4ff9f6e' || true
            echo "5b53a661b2d8fca38bc2ffe07f64c3e2ad95367fd303838d4cf1d5fffc574691  .ci/rsp3/change.patch.gz" | sha256sum -c -
            gzip -cd .ci/rsp3/change.patch.gz > /tmp/rsp3.patch
            echo "fbc405a4d270ebb6b9eae6c7a678ba9e5dd990be83480de10d6fb8a74671b931  /tmp/rsp3.patch" | sha256sum -c -
            git apply --check /tmp/rsp3.patch
            git apply --index /tmp/rsp3.patch
            git rm .ci/rsp3/change.patch.gz
            git diff --cached --check
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Study acquired residual-guided VM search policies; preserve RSP2 admission'
            echo "RSP3_APPLIED=1" >> "$GITHUB_ENV"
          fi
          git rev-parse HEAD > rsp3-evidence/tested-revision.txt
      - name: Rust 1.99
        shell: bash
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup override set 1.99.0
          { rustc --version; cargo --version; } > rsp3-evidence/toolchain.txt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile, verify source binding and whole project regressions
        shell: bash
        run: |
          set -euo pipefail
          python scripts/project_audit.py > rsp3-evidence/source-audit.json
          python scripts/check_docs.py > rsp3-evidence/docs.log
          python scripts/check_project.py 2>&1 | tee rsp3-evidence/tests.log
      - name: Replay frozen policy experiment and independent controls
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --example rsp3_experience -- train rsp3-evidence/experiment > rsp3-evidence/train-summary.json
          cargo run --locked --example rsp3_experience -- examine rsp3-evidence/experiment > rsp3-evidence/exam-summary.json
          cargo run --locked --example rsp3_experience -- confirm rsp3-evidence/experiment > rsp3-evidence/confirmation-summary.txt
          cargo run --locked --example rsp3_experience -- producer rsp3-evidence/experiment > rsp3-evidence/producer-summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('rsp3-evidence')
          t=json.loads((root/'train-summary.json').read_text())
          assert t['candidate_count']==128 and t['changed'] and t['feedback_read']
          assert t['rsp2_adoption'] is False and t['study_work']==178200530
          assert t['dev']=={'cold':10,'learned':17,'loss_size':10}
          e=json.loads((root/'exam-summary.json').read_text())
          for name,want in {'related':(28,19,20,17),'transfer':(7,5,3,4),'reserved':(7,2,2,4)}.items():
            x=e[name]
            assert (x['learned'],x['cold'],x['strong'],x['scrambled'])==want
          c=(root/'confirmation-summary.txt').read_text()
          assert 'related: learned 72/192, cold 50, loss_size 59, scrambled 29' in c
          assert 'transfer: learned 25/192, cold 9, loss_size 7, scrambled 11' in c
          assert 'reserved: learned 22/192, cold 16, loss_size 22, scrambled 3' in c
          p=json.loads((root/'producer-summary.json').read_text())['comparisons']
          assert [(x['arms']['trained']['child_verified'],x['arms']['cold']['child_verified']) for x in p]==[(2,1),(0,1)]
          (root/'receipt.json').write_text(json.dumps({'status':'PASS_REPLAY_ONLY','not_independent_new_qualification':True,'rsp2_adopted':False},indent=2))
          PY
      - name: Publish only checked non-workflow source changes
        if: env.RSP3_APPLIED == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'research/rsp3-experience-20261018'
          git diff --exit-code
          header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$header"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" push origin HEAD:refs/heads/research/rsp3-experience-20261018
          git rev-parse HEAD > rsp3-evidence/published-revision.txt
      - name: Preserve verified source and negative experiments
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsp3-experiment-${{ github.sha }}
          path: rsp3-evidence/
          retention-days: 7
          if-no-files-found: warn
