name: Factor world independent-property development diagnostic
on:
  push:
    branches: ['research/beyond-intel4']
    paths:
      - 'tests/factorized_world1_development.rs'
      - 'docs/FACTOR_WORLD1_PROTOCOL.md'
      - '.github/workflows/factor-world1-development.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
      - uses: Swatinem/rust-cache@v2
      - name: Compile factorized heldout test
        run: cargo check --locked --test factorized_world1_development
      - name: Run diagnostic and log true cognitive verdict (FAIL is retained)
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --release --test factorized_world1_development factor_world1_first_compositional_transfer_diagnostic -- --exact --nocapture 2>&1 | tee factor-world1.log
      - name: Verify scoring summary exists
        run: grep -F 'FACTOR_WORLD1_SUMMARY' factor-world1.log
      - name: Retain diagnostic, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factor-world1-development-evidence
          path: factor-world1.log
          if-no-files-found: ignore
