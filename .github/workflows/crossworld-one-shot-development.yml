name: Cross-world grounded object memory - one-shot fresh diagnostic
on:
  push:
    branches: ['research/beyond-intel4']
    paths:
      - 'scripts/external_crossworld_grounding.py'
      - 'docs/CROSSWORLD_OBJECT2_PROTOCOL.md'
      - '.github/workflows/crossworld-one-shot-development.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  one-shot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env: {CARGO_BUILD_JOBS: 2, SDL_VIDEODRIVER: dummy}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.0'}
      - uses: Swatinem/rust-cache@v2
      - name: Install real Farama simulator
        run: python -m pip install 'minigrid==3.1.0'
      - name: Compile Rust native agent
        run: |
          cargo test --locked --release --test grounded_object_memory
          cargo build --locked --release --bin external_world_agent
      - name: First single-point lesson on unseen external seed set
        shell: bash
        run: |
          set -o pipefail
          python scripts/external_crossworld_grounding.py \
            --agent target/release/external_world_agent \
            --max-lessons 1 --seed-offset 2000 \
            --output crossworld-one-shot.json \
            2>&1 | tee crossworld-one-shot.log
      - name: Print and retain actual verdict
        run: |
          grep -F 'CROSSWORLD_OBJECT_SUMMARY verdict=' crossworld-one-shot.log
          python - <<'PY'
          import json
          result=json.load(open("crossworld-one-shot.json"))
          assert result["max_lessons"]==1
          assert result["training_seeds"]==list(range(6100,6112))
          assert result["holdout_seeds"]==list(range(7100,7108))
          PY
      - name: Upload evidence even if negative
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crossworld-one-shot-fresh-open-evidence
          path: |
            crossworld-one-shot.json
            crossworld-one-shot.log
          if-no-files-found: ignore
