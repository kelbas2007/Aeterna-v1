name: DC offline build tools
on:
  push:
    branches: [research/beyond-intel4]
    paths: ['.github/workflows/dc-offline-tools.yml']
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned toolchain and prepare offline dependencies
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt
          rustup override set 1.99.0
          mkdir -p offline/toolchain/bin
          sysroot=$(rustc --print sysroot)
          cp "$sysroot/bin/rustc" "$sysroot/bin/cargo" "$sysroot/bin/rustfmt" offline/toolchain/bin/
          cp -a "$sysroot/lib" offline/toolchain/
          cargo vendor --locked --versioned-dirs offline/vendor > offline/config.toml
          { rustc --version --verbose; cargo --version; git rev-parse HEAD; } > offline/provenance.txt
          tar -czf dc-offline-tools.tar.gz offline
          sha256sum dc-offline-tools.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: dc-offline-tools
          path: dc-offline-tools.tar.gz
          retention-days: 1
          compression-level: 0
